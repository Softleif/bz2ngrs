[package]
name = "bz2ngrs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT AND Apache-2.0 WITH LLVM-exception"
description = "Fast one-shot bzip2 compression and decompression, a Rust port of bz2-ng"
readme = "README.md"
keywords = ["bzip2", "compression", "decompression", "simd", "cram"]
categories = ["compression"]
publish = false

[workspace]
members = [".", "bench"]

[dependencies]
fearless_simd = "1.1"
fearless_simd_macros = "0.1"

[dev-dependencies]
bzip2 = "0.6.1"
hegeltest = "0.49.2"
# Compiles fearless_simd's scalar `Fallback` level on SIMD targets too, so
# tests can run every kernel at every level (as seqair does).
fearless_simd = { version = "1.1", features = ["force_support_fallback"] }
crc-fast = { version = "1.10.0", default-features = false, features = ["std"] }
# An independent suffix sorter (a port of libdivsufsort): the block sorter's
# oracle on large inputs.
divsufsort = "2.0.0"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
dbg_macro = "warn"
panic = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unwrap_used = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
debug = 1

[profile.dev.package."*"]
opt-level = 3

# Release with full debug info, for samply line attribution.
[profile.profiling]
inherits = "release"
debug = true
